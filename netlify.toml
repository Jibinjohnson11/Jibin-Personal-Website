# Netlify reads the Node version from .nvmrc (22), so it isn't repeated here.
# Unknown URLs get dist/404.html automatically (Netlify serves it for any 404).

[build]
  command = "npm run build"
  publish = "dist"

# One canonical host: www (and plain http) go to https://jibinjohnson.in
[[redirects]]
  from = "https://www.jibinjohnson.in/*"
  to = "https://jibinjohnson.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.jibinjohnson.in/*"
  to = "https://jibinjohnson.in/:splat"
  status = 301
  force = true

# Security headers for every response. The Content-Security-Policy is generated at build
# time into dist/_headers (integrations/csp.mjs) so its script hashes always match.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

# Fingerprinted build assets never change, so browsers can keep them for a year.
# HTML keeps Netlify's default (max-age=0, must-revalidate) so new deploys show at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
